name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run python --version
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Types
        run: uv run mypy src
      # Unit tests plus the synthetic regression benchmark. The real-data
      # benchmarks need unpublished inputs and skip themselves here.
      - name: Tests
        run: uv run pytest -m "not integration" --cov=pv_geom --cov-fail-under=88

  # The documentation site must build without warnings. (Whether its generated
  # reference pages are current is a unit test.)
  docs:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra docs
      - run: uv run mkdocs build --strict

  # A core-only install (no extras) must measure and report: no cloud packages,
  # no test tooling. Runs the synthetic study area end to end.
  core-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --python 3.12
      - run: uv run pv-geom version
      - name: Measure and report without extras
        run: |
          uv run python -c "
          from pathlib import Path
          from pv_geom.sample import write_scene
          from pv_geom.testing import run_benchmark
          from pv_geom.report import build_report
          out = run_benchmark(write_scene(Path('core_demo/bench')), Path('core_demo/out'))
          print(build_report(out).html)
          "
