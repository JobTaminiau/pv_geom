# pv_geom default configuration. Every key is optional: a study-area config only
# needs the keys it changes (see phoenix.yaml, delaware.yaml).
crs:
  target: auto                # the LiDAR's own projected, metric CRS. "auto" reads it
                              # from the tile index; or assert one, e.g. EPSG:6341.
                              # Points are not reprojected and all thresholds are metres.

panel_plane:
  erosion_m: 0.15
  ransac_threshold_m: 0.05
  ransac_threshold_max_m: 0.15   # if a fit fails at 5 cm, refit at 2x the measured scatter
                                 # of the returns, up to this cap (flag: wide_tolerance_fit).
                                 # Noisier collections need it: Delaware 2023 scatters
                                 # ~7.5 cm about a roof plane, Phoenix 2020 ~2 cm.
  min_inlier_frac: 0.6
  max_iter: 200
  min_density_pts_per_m2: 3   # spike: tiles deliver ~9-11 pts/m^2; 3 is the safe floor
  min_points: 30              # flat floor (PRD §7.1's area-based formula was too lax)
  tilt_floor_deg: 1.0
  uncertainty_method: bootstrap   # bootstrap | covariance
  bootstrap_samples: 50

multi_plane:
  enabled: true
  secondary_min_frac: 0.20
  ew_rack_azimuth_tol_deg: 25
  ew_rack_tilt_tol_deg: 5

roof_plane:
  enabled: true
  buffer_m: 3.0
  buffer_max_m: 5.0
  min_points: 100
  ransac_threshold_m: 0.15
  rmse_max_m: 0.10
  min_inlier_frac: 0.4           # ring-specific consensus floor, BELOW the panel fit's
                                 # 0.6: a ring spans facets/eaves/parapets, so no single
                                 # plane holds 60% of it on a gable. At 0.6 the v0.1.0
                                 # Phoenix run rejected 46.9% of rows whose fits would
                                 # have passed rmse_max_m — and an unfitted roof means
                                 # no panel-standoff (vintage) screen is possible.
  collar_m: 1.2                  # the ring band adjacent to the array. If the wide-ring
  collar_min_points: 40          # plane doesn't explain collar_agreement_min of it, refit
  collar_agreement_min: 0.5      # on the collar — otherwise RANSAC can report the facet
                                 # ACROSS the ridge (measured: 3 of 7 recovered rows were
                                 # 20-45 deg off before this guard).
  open_ring: true                # with no footprint layer, or a polygon missing every
                                 # footprint, fit the reference from an unclipped ring
                                 # (rows say which in roof_ref_source)
  min_overlap_frac: 0.5          # footprint∩polygon / polygon area for on_building=True
                                 # (sliver touches must not become "rooftop")

heights:
  ground_search_radius_m: 10.0
  ground_fallback_k: 50          # k-nearest ground fallback when the disk is empty
  ground_fallback_max_radius_m: 100.0   # (large commercial roofs; 0 disables)
  min_panel_standoff_m: 0.05     # below this the panel plane is not resolvably above the
                                 # roof -> `no_panel_standoff`; at or above it the row is
                                 # geometry_basis = panel_confirmed

vintage:
  # Capture dates of the two inputs. They are stamped on every row and decide
  # its geometry_basis: if the polygons are newer than the LiDAR, an array may
  # not have existed when the LiDAR was flown.
  polygon_vintage: null          # imagery the polygons came from: YYYY, YYYY-MM or
                                 # YYYY-MM-DD (a year/month counts as its last day)
  polygon_vintage_column: null   # optional per-polygon date column in the polygon layer
  lidar_date: null               # declare it, or leave null to measure each tile's flight
                                 # date from per-point GPS time (the LAS header date is a
                                 # delivery date and can lag by more than a year)
  sample_tiles: 25               # tiles sampled for the up-front flight-window check
                                 # (header + first chunk, streamed); 0 disables

mounting_rules:
  enabled: false                 # ARCHIVED in 0.2.0. Validation put carport precision at
                                 # 5% and pole-mount at 0%. Off by default; enabling adds the
                                 # experimental mounting_* columns. Thresholds below are
                                 # uncalibrated.
  R1: { panel_roof_angle_deg_max: 5.0, height_above_roof_m_max: 0.5 }
  R2: { panel_roof_angle_deg_min: 5.0, height_above_roof_m_max: 1.5,
        fallback_tilt_deg_min: 5.0, fallback_height_above_ground_m_min: 2.5 }
  R3: { height_above_ground_m_min: 2.0, aspect_ratio_min: 2.0,
        height_above_ground_m_max: 6.0 }   # cap: taller = likely missing-footprint rooftop
  R4: { aspect_ratio_min: 4.0, tilt_deg_max: 35.0, height_above_ground_m_max: 2.0 }
  R5: { tilt_deg_min: 5.0, height_above_ground_m_max: 2.0 }
  R7: { tilt_deg_max: 20.0 }     # east_west_rack_rooftop (evaluated before R1/R2)
  R8: { height_above_ground_m_min: 2.0, area_m2_max: 20.0, aspect_ratio_max: 2.0,
        height_above_ground_m_max: 8.0 }   # pole_mount (before R3)
  flat_roof_tilt_deg_max: 7.0    # R1 flat/pitched label split + R7 gable-facet guard
  confidence_margin: 0.5
  canopy_min_ground_points_under: 15   # ground returns inside the polygon +
  canopy_gap_m_min: 2.0                #   multi-metre gap = open-sided canopy signature
  missing_footprint_hag_m: 6.0   # off-building above this w/o canopy evidence -> flag
  no_panel_standoff_confidence_max: 0.5   # confidence ceiling for a labelled row carrying
                                          # `no_panel_standoff`: it satisfies R1 maximally
                                          # while being exactly what an array missing from
                                          # the cloud looks like. 1.0 disables.

io:
  lidar_reader: laspy          # laspy | pdal (pdal needs the [pdal] extra + system libs)
  s3:
    requester_pays: false
    region: us-east-2
  classification:              # ASPRS classes used per role; spike found USGS LPC tiles
    panel_class_primary: 6     #   are class-1/2/7 only (no class 6), so we fall back to
    panel_class_fallback: 1    #   class-1 returns above-ground when class 6 is absent.
    ground_class: 2
    fallback_height_above_ground_m: 0.8    # min height above LOCAL ground to keep a class-1
                                           # return as panel-candidate (1.5 deleted the lower
                                           # half of ground-mount arrays)
    ground_grid_cell_m: 5.0                # cell size of the local-ground elevation grid

compute:
  backend: local               # local | coiled
  coiled:
    name: pv-geom
    n_workers: 40
    worker_memory: "16GiB"        # densest Phoenix tiles need >8 GiB; verified
                                  # via 10k Coiled bench, 2026-05-02.
    worker_cpu: 4
    software: pv-geom-2026-05
  local:
    n_workers: 8
    threads_per_worker: 2

