# Metro Phoenix overrides; unset keys take the defaults in default.yaml.
crs:
  target: EPSG:6341           # USGS LPC AZ MaricopaPinal 2020 — verified via spike

vintage:
  # The Mask R-CNN detections come from the Maricopa County
  # Aerial2024Sep2024OctOrtho product, acquired September-October 2024 (a
  # window, so its last day counts). The USGS 3DEP tiles were flown in late
  # November 2020 by GPS time (the LAS header says 2021-06-30, the delivery
  # date). Arrays built in the ~3.9 years between are in the polygon set but
  # not in the point cloud. The LiDAR date is left to be measured per tile.
  # (Until 0.3 this file said 2024-04-01, which understated the gap by ~7 months.)
  polygon_vintage: 2024-10

io:
  lidar_reader: laspy

compute:
  backend: coiled
  coiled:
    name: pv-geom-phoenix
    n_workers: 80
    worker_memory: "16GiB"      # the densest Phoenix tiles (~3000 polygons,
                                # 50M+ points) blow through 8 GiB on the
                                # tile-group worker; verified via the 10k
                                # Coiled bench (2026-05-02).
                                # 2026-07-29 full run: one tile-group task
                                # per worker (nthreads=1 in coiled_env) —
                                # two concurrent dense-metro groups breach
                                # 16 GiB. 2 CPU + more workers keeps the
                                # cost profile; memory is the binding
                                # constraint, not cores.
    worker_cpu: 2
    software: pv-geom-2026-05
