[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pv-geom"
version = "0.6.0.dev0"
description = "Tilt, orientation and height of solar PV polygons measured from LiDAR, with publication-ready datasets, figures and reports."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Job Taminiau", email = "jt@freefutures.org" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "laspy[lazrs]>=2.5",
    "fsspec>=2024.10",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13.7",
    "dask>=2025.10",
    "distributed>=2025.10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# pdal Python bindings need the system PDAL library; install via conda on Windows.
# Worker images on Coiled should pull this in.
pdal = ["pdal>=3.4"]
# Reading inputs from, or writing output to, S3.
cloud = [
    "s3fs>=2024.10",
    "boto3>=1.35",
]
# Running on a Coiled cluster (workers read from S3, so it implies `cloud`).
coiled = [
    "coiled>=1.128",
    "s3fs>=2024.10",
    "boto3>=1.35",
]
dev = [
    "s3fs>=2024.10",
    "boto3>=1.35",
    "coiled>=1.128",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.10",
    # botocore[crt] is needed when AWS credentials come from SSO (`aws login`).
    # Production envs (Coiled IAM roles) don't need it; local devs typically do.
    "botocore[crt]>=1.35",
]

[project.scripts]
pv-geom = "pv_geom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_geom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "scripts/archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # line length is a guideline here, not a gate
    "RUF001",   # report text and axis labels use real typography on purpose:
    "RUF002",   #   degree signs, en dashes, sigma
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/pv_geom/cli.py" = ["B008"]     # typer.Option(...) in defaults is how Typer works

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = [
    "geopandas.*", "shapely.*", "pyarrow.*", "pandas.*", "laspy.*", "pyproj.*",
    "yaml.*", "fsspec.*", "boto3.*", "botocore.*", "dask.*", "distributed.*",
    "coiled.*", "pdal.*", "matplotlib.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# Archived code: kept runnable and tested, not held to the typing gate.
[[tool.mypy.overrides]]
module = "pv_geom.experimental.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration test that hits S3 (gated by RUN_INTEGRATION env var)",
    "slow: long-running test",
]
